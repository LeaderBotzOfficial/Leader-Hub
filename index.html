<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROOT/LeaderHub/Server/DeveloperPage/Update</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#e0e5ec;
font-family:Poppins,sans-serif;

}
.container{

width:90%;
max-width:420px;

}

.box{

background:#e0e5ec;
padding:30px;
border-radius:30px;
text-align:center;

box-shadow:
10px 10px 25px #b8bcc2,
-10px -10px 25px #ffffff;

}

.icon{

font-size:45px;
color:#555;
margin-bottom:15px;

}

h2{

font-family:Orbitron;
font-size:22px;

}

p{

margin-top:15px;
color:#555;
line-height:1.7;

}


button{

margin-top:25px;
width:100%;
height:55px;

border:none;
border-radius:20px;

background:#e0e5ec;

font-size:17px;
font-weight:600;

box-shadow:
8px 8px 15px #b8bcc2,
-8px -8px 15px #fff;

}


button:active{

box-shadow:
inset 8px 8px 15px #b8bcc2,
inset -8px -8px 15px #fff;

}


.hidden{

display:none;

}


/* Speedometer */

.speed{

text-align:center;

}

svg{

width:260px;
height:260px;

}

.bg{

fill:none;
stroke:#c7ccd2;
stroke-width:18;

}

.progress{

fill:none;
stroke:#4385ff;
stroke-width:18;
stroke-linecap:round;

stroke-dasharray:754;
stroke-dashoffset:754;

transform:rotate(-90deg);
transform-origin:center;

}


.text{

font-family:Orbitron;
font-size:25px;
fill:#333;

}


.balance{

font-size:18px;
font-weight:600;

margin-top:10px;

}

</style>

</head>


<body>

<div class="container">


<div class="box" id="page1">

<div class="icon">

<i class="fa-solid fa-screwdriver-wrench"></i>

</div>


<h2>
Leader Hub Server
</h2>
<p>

Our website is currently under maintenance.
<br>
We are updating the system and fetching the older website data for better performance.

</p>


<button onclick="startUpdate()">

<i class="fa-solid fa-cloud-arrow-down"></i>
 Fetch

</button>


</div>


<div class="box hidden" id="page2">


<div class="speed">

<h2>
Server Restarting
</h2>


<svg>

<circle class="bg"
cx="130"
cy="130"
r="110"/>


<circle id="bar"
class="progress"
cx="130"
cy="130"
r="110"/>


<text id="percent"
x="130"
y="140"
text-anchor="middle"
class="text">

0%

</text>

</svg>

<div class="balance" id="mb">

Remaining : 102400 MB

</div>

<p>

Updating website...

</p>


</div>

</div>


<div class="box hidden" id="page3">


<div class="icon">

<i class="fa-solid fa-triangle-exclamation"></i>

</div>


<h2>
Website Under Maintenance
</h2>


<p>
Updating... Join to official channel
</p>

</div>

</div>

<audio id="song" hidden>

<source src="FUNK_TAKA.mp3">

</audio>


<script>


const channel =
"https://whatsapp.com/channel/0029Vb8exbR1SWt5nwypHs2E";



function startUpdate(){


localStorage.setItem("updated","true");


document.getElementById("page1").classList.add("hidden");

document.getElementById("page2").classList.remove("hidden");



let audio=document.getElementById("song");

audio.play();



let bar=document.getElementById("bar");

let percent=document.getElementById("percent");

let mb=document.getElementById("mb");



let total=102400;

let time=180000;

let step=100;

let count=time/step;

let current=0;


let circumference=754;



let timer=setInterval(()=>{


current++;


let value=current/count;


bar.style.strokeDashoffset=
circumference-(circumference*value);



let p=Math.floor(value*100);


percent.innerHTML=p+"%";


let remain=Math.floor(total-(total*value));


mb.innerHTML=
"Server : "+remain+" GB/Hz";




if(current>=count){


clearInterval(timer);


openMaintenance();


}


},step);



}



function openMaintenance(){


document.getElementById("page2").classList.add("hidden");


document.getElementById("page3").classList.remove("hidden");



setTimeout(()=>{


window.location.href=channel;


},3000);



}



window.onload=function(){


if(localStorage.getItem("updated")){


document.getElementById("page1").classList.add("hidden");

document.getElementById("page3").classList.remove("hidden");


setTimeout(()=>{

window.location.href=channel;

},3000);


}


}


</script>
</body>
</html>
